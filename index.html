<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tui - La beauté des ongles | Montréal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #faf8f5;
      --header-bg: #f5f2eb;
      --table-head-bg: #efece6;
      --text-dark: #1c1b1a;
      --text-muted: #6b6863;
      --border-color: #e5e0d8;
      --footer-navy: #2f3f50;
      --link-blue: #1a73e8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* --- 1. HEADER & MENU THẢ XUỐNG --- */
    header {
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      text-decoration: none;
    }

    .logo-wrapper img {
      height: 84px;
      width: auto;
      display: block;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links > li {
      position: relative;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-dark);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.2s;
    }

    .nav-links a:hover {
      opacity: 0.65;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 215px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 6px 0;
      list-style: none;
      z-index: 1001;
    }

    .nav-links li:hover .dropdown-menu {
      display: block;
    }

    .dropdown-menu li a {
      display: block;
      padding: 10px 18px;
      font-size: 13.5px;
      color: var(--text-dark);
      border-bottom: 1px solid #f4f1ec;
    }

    .dropdown-menu li:last-child a {
      border-bottom: none;
    }

    .dropdown-menu li a:hover {
      background-color: #faf8f5;
      opacity: 1;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .btn-outline {
      padding: 9px 22px;
      border: 1px solid var(--text-dark);
      border-radius: 999px;
      background: transparent;
      color: var(--text-dark);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.25s ease;
    }

    .btn-outline:hover {
      background-color: var(--text-dark);
      color: #ffffff;
    }

    /* Mobile menu button */
    .mobile-menu-toggle {
      display: none;
      background: none;
      border: 1px solid #d5d1c8;
      border-radius: 6px;
      padding: 7px 11px;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-dark);
    }

    .mobile-drawer {
      display: none;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px 20px;
    }

    .mobile-drawer.open {
      display: block;
    }

    .mobile-drawer a {
      display: block;
      padding: 9px 0;
      color: var(--text-dark);
      text-decoration: none;
      font-size: 14.5px;
      border-bottom: 1px dashed #ece8e0;
    }

    .mobile-drawer .mobile-sub-links {
      padding-left: 16px;
      background: #faf8f5;
      border-radius: 6px;
      margin: 6px 0;
    }

    /* --- 2. MAIN BANNER --- */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 460px;
      background: linear-gradient(to right, #c9c7ba 0%, #dcdad0 45%, #e8e6df 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-banner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero-overlay {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 24px;
    }

    .btn-hero {
      padding: 13px 32px;
      background-color: #ffffff;
      color: var(--text-dark);
      border: none;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 4px 16px rgba(0,0,0,0.14);
      transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }

    .btn-hero:hover {
      background-color: var(--text-dark);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* --- 3. VIDÉO ("SEE IT IN ACTION") --- */
    .action-section {
      padding: 72px 24px 64px;
      max-width: 960px;
      margin: 0 auto;
      text-align: center;
    }

    .action-section h2 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .action-section .subtitle {
      font-size: 14.5px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .video-frame-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.08);
      background: #000;
    }

    .video-frame-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* --- 4. ADRESSE & HEURES --- */
    .location-section {
      padding: 72px 24px;
      max-width: 1140px;
      margin: 0 auto;
      border-top: 1px solid var(--border-color);
    }

    .location-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 48px;
      align-items: center;
    }

    .map-wrapper {
      width: 100%;
      height: 360px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #d5d1c8;
      background-color: #e5e3df;
    }

    .map-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .location-details h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .location-columns {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 24px;
    }

    .location-info-text {
      font-size: 13.5px;
      line-height: 1.65;
    }

    .location-info-text .business-name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .location-info-text a {
      color: var(--link-blue);
      text-decoration: none;
      display: inline-block;
      margin-top: 4px;
    }

    .location-info-text a:hover {
      text-decoration: underline;
    }

    .hours-table {
      width: 100%;
      font-size: 13px;
      border-collapse: collapse;
    }

    .hours-table td {
      padding: 4px 0;
      color: var(--text-dark);
    }

    .hours-table td:last-child {
      text-align: right;
      color: var(--text-muted);
    }

    /* --- 5. CONTACTEZ-NOUS --- */
    .contact-section {
      padding: 72px 24px 84px;
      max-width: 1140px;
      margin: 0 auto;
      border-top: 1px solid var(--border-color);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 48px;
      align-items: start;
    }

    .contact-text h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .contact-text p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 360px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #d5d1c8;
      border-radius: 4px;
      background: #ffffff;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-dark);
    }

    .contact-form textarea {
      min-height: 110px;
      resize: vertical;
    }

    .contact-form button {
      align-self: flex-start;
      padding: 11px 28px;
      border-radius: 999px;
      border: 1px solid #d5d1c8;
      background: #e9e6df;
      color: var(--text-dark);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .contact-form button:hover {
      background: var(--text-dark);
      color: #ffffff;
      border-color: var(--text-dark);
    }

    /* --- 6. TRANG CON DỊCH VỤ & BẢNG GIÁ DẠNG TABLE MATRIX --- */
    .service-subpage {
      display: none;
      padding: 56px 24px 88px;
      max-width: 1020px;
      margin: 0 auto;
      min-height: 65vh;
    }

    .service-subpage.active-page {
      display: block;
      animation: fadeInPage 0.25s ease;
    }

    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .subpage-breadcrumb {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .back-home-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
    }

    .back-home-btn:hover {
      color: var(--text-dark);
      text-decoration: underline;
    }

    .subpage-quick-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .subpage-pill {
      padding: 6px 14px;
      border: 1px solid #d5d1c8;
      border-radius: 999px;
      font-size: 12.5px;
      text-decoration: none;
      color: var(--text-dark);
      transition: all 0.2s;
    }

    .subpage-pill:hover,
    .subpage-pill.current {
      background-color
